<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duty Roster → Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>Duty Roster → Calendar</h1>
      <div class="actions">
        <label class="file-btn">
          <span>Choose .xlsx File</span>
          <input type="file" id="file" accept=".xlsx">
        </label>
        <button id="export" class="export-btn" disabled>Export ICS</button>
      </div>
    </div>
  </header>

  <section id="mapping" class="mapping-section" hidden></section>

  <div class="status-bar">
    <p id="status">Select an .xlsx duty roster file above to begin.</p>
  </div>

  <main id="calendar" class="calendar-main"></main>

  <script src="js/xlsx.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
